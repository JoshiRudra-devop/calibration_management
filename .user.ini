; Shreeji Instruments — PHP per-directory security settings
; Applied automatically by Apache/PHP via .user.ini (no server restart needed).

; ── Error reporting ─────────────────────────────────────────
; Never expose PHP errors to the browser.
display_errors = Off
log_errors = On
error_reporting = E_ALL

; ── Request limits ──────────────────────────────────────────
max_input_vars = 1000
max_input_time = 60
max_execution_time = 60
memory_limit = 128M

; ── Upload limits (PDF uploads up to 50 MB) ─────────────────
post_max_size = 55M
upload_max_filesize = 51M

; ── Session hardening ───────────────────────────────────────
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict

; ── Disable dangerous shell/process functions ───────────────
; parse_ini_file is intentionally NOT in this list — config.php uses it to load .env.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen
